name: Build presentation PDF

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: presentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install LaTeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-pictures lmodern poppler-utils

      - name: Compile the presentation
        run: |
          mkdir -p build
          # Stable PDF metadata avoids commits caused only by the build time.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct -- presentation.tex)"
          export SOURCE_DATE_EPOCH FORCE_SOURCE_DATE=1
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error \
            -output-directory=build presentation.tex
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error \
            -output-directory=build presentation.tex

      - name: Render every slide for visual review
        run: |
          pdftoppm -png -r 120 build/presentation.pdf build/slide
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          PDF compiled and every slide rendered. Download the presentation-preview
          artifact below and visually inspect all slides for clipping, overlaps,
          legibility, and consistent styling. Compilation does not establish visual quality.
          SUMMARY

      - name: Upload the PDF, slide previews, and build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: presentation-preview
          path: |
            build/presentation.pdf
            build/slide-*.png
            build/presentation.log
          if-no-files-found: warn
          retention-days: 7

      - name: Commit the PDF to the same branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          # Never publish a PDF from an obsolete revision over newer source.
          git fetch --no-tags origin "refs/heads/$BRANCH_NAME"
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo "Branch advanced; its newer push will build the current source."
            exit 0
          fi
          cp build/presentation.pdf presentation.pdf
          git add -- presentation.pdf
          if git diff --cached --quiet -- presentation.pdf; then
            echo "The committed presentation PDF is already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Rebuild presentation PDF"
          # Pushes authenticated with GITHUB_TOKEN do not trigger another push run.
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
